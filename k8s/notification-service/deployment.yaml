apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: health-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: 552823821096.dkr.ecr.us-east-1.amazonaws.com/notification-service:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8003