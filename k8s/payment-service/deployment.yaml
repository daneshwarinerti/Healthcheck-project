apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: health-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: 552823821096.dkr.ecr.us-east-1.amazonaws.com/payment-service:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8002