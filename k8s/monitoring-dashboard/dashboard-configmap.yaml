apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-configmap
  namespace: health-monitoring
  labels:
    app.kubernetes.io/name: monitoring-dashboard
    app.kubernetes.io/component: dashboard
data:
  APP_ENV: "production"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  USER_SERVICE_URL: "http://user-service:8001/health"
  PAYMENT_SERVICE_URL: "http://payment-service:8002/health"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8003/health"
  POSTGRES_HEALTH_URL: "postgres:5432"
  REDIS_HEALTH_URL: "redis:6379"
  RABBITMQ_HEALTH_URL: "rabbitmq:5672"
