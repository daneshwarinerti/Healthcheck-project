apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-dashboard
  namespace: health-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monitoring-dashboard
  template:
    metadata:
      labels:
        app: monitoring-dashboard
    spec:
      containers:
      - name: monitoring-dashboard
        image: 552823821096.dkr.ecr.us-east-1.amazonaws.com/monitoring-dashboard:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8000