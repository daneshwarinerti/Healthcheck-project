apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-dashboard
  namespace: health-monitoring
  labels:
    app.kubernetes.io/name: monitoring-dashboard
    app.kubernetes.io/component: dashboard
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: monitoring-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monitoring-dashboard
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: monitoring-dashboard
          image: 552823821096.dkr.ecr.us-east-1.amazonaws.com/monitoring-dashboard:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: dashboard-configmap
            - secretRef:
                name: dashboard-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
