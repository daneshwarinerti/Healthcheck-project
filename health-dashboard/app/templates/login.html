<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ app_name }}</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="auth-body">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row w-100 justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card auth-card shadow-lg border-0">
                    <div class="card-body p-5">
                        <!-- Brand / Logo Header -->
                        <div class="text-center mb-4">
                            <div class="auth-icon-wrapper mb-3 mx-auto">
                                <i class="bi bi-shield-lock-fill"></i>
                            </div>
                            <h2 class="auth-title fw-bold text-white">{{ app_name }}</h2>
                            <p class="auth-subtitle text-light-50 small">Admin Authentication Portal</p>
                        </div>

                        <!-- Error Alert -->
                        <div id="error-alert" class="alert alert-danger d-none shadow-sm" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span id="error-message">Invalid credentials</span>
                        </div>

                        <!-- Login Form -->
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="username" class="form-label text-light-50 small fw-medium text-uppercase tracking-wider">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark-20 border-dark-30 text-light-50"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control bg-dark-20 border-dark-30 text-white" id="username" placeholder="Enter username" required autocomplete="username">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label text-light-50 small fw-medium text-uppercase tracking-wider">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark-20 border-dark-30 text-light-50"><i class="bi bi-key"></i></span>
                                    <input type="password" class="form-control bg-dark-20 border-dark-30 text-white" id="password" placeholder="Enter password" required autocomplete="current-password">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold transition-all d-flex align-items-center justify-content-center gap-2" id="login-submit-btn">
                                <span class="spinner-border spinner-border-sm d-none" id="login-spinner" role="status" aria-hidden="true"></span>
                                <span id="login-btn-text">Sign In</span>
                                <i class="bi bi-arrow-right" id="login-btn-icon"></i>
                            </button>
                        </form>

                        <!-- Back to Dashboard -->
                        <div class="text-center mt-4">
                            <a href="/" class="text-decoration-none text-light-50 small hover-white">
                                <i class="bi bi-arrow-left me-1"></i> Back to Live Dashboard (Read-Only)
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Authentication Javascript -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem("token")) {
                window.location.href = "/";
                return;
            }

            const loginForm = document.getElementById("login-form");
            const errorAlert = document.getElementById("error-alert");
            const errorMessage = document.getElementById("error-message");
            const submitBtn = document.getElementById("login-submit-btn");
            const spinner = document.getElementById("login-spinner");
            const btnText = document.getElementById("login-btn-text");
            const btnIcon = document.getElementById("login-btn-icon");

            loginForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                errorAlert.classList.add("d-none");
                
                // Show loading spinner
                submitBtn.disabled = true;
                spinner.classList.remove("d-none");
                btnText.textContent = "Verifying...";
                btnIcon.classList.add("d-none");

                const usernameVal = document.getElementById("username").value.trim();
                const passwordVal = document.getElementById("password").value;

                try {
                    const response = await fetch("/api/auth/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            username: usernameVal,
                            password: passwordVal
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        // Extract server error details
                        let msg = data.detail || "Authentication failed";
                        if (data.errors && data.errors.length > 0) {
                            msg = data.errors.join(", ");
                        }
                        throw new Error(msg);
                    }

                    localStorage.setItem("token", data.access_token);
                    localStorage.setItem("username", usernameVal);
                    window.location.href = "/";
                } catch (err) {
                    errorMessage.textContent = err.message;
                    errorAlert.classList.remove("d-none");
                    
                    // Reset button states
                    submitBtn.disabled = false;
                    spinner.classList.add("d-none");
                    btnText.textContent = "Sign In";
                    btnIcon.classList.remove("d-none");
                }
            });
        });
    </script>
</body>
</html>
