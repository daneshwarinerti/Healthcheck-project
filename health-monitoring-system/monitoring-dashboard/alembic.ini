# Alembic configuration for database migrations.

[alembic]
# Path to migration scripts folder
script_location = alembic

# Prepend sys.path to allow imports from dashboard project
prepend_syspath = .

# Default SQLite URL (dynamically overridden in env.py using env variables)
sqlalchemy.url = sqlite:///./health.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
